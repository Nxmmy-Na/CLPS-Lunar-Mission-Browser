# Render Blueprint: deploys the FastAPI backend, which also serves the frontend.
services:
  - type: web
    name: clps-lunar-browser
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
